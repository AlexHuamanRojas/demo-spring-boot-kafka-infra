apiVersion: sources.knative.dev/v1beta1
kind: KafkaSource

metadata:
  name: cliente-knative-source-ext
  namespace: demo

spec:
  consumerGroup: knative-external-group

  bootstrapServers:
    - kafka.kafka.svc.cluster.local:9092

  topics:
    - cliente-knative

  sink:
    uri: http://host.docker.internal:8081/api/ext/clientes